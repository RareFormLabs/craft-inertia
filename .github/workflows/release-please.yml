name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      - name: Release Please
        id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The Craft Plugin Store only recognizes `## X.Y.Z - YYYY-MM-DD` changelog
      # headings, but release-please writes `## [X.Y.Z](compare-url) (YYYY-MM-DD)`.
      - name: Checkout release PR
        if: steps.rp.outputs.pr
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.rp.outputs.pr).headBranchName }}

      - name: Format changelog heading for the Craft Plugin Store
        if: steps.rp.outputs.pr
        run: |
          set -euo pipefail
          sed -E -i 's/^(## \[[^]]+\]\([^)]+\)) \(([0-9]{4}-[0-9]{2}-[0-9]{2})\)$/\1 - \2/' CHANGELOG.md
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: format changelog heading for the Craft Plugin Store"
          git push
